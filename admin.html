<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CREDIMACH - Panel Premium</title>
<style>
:root{--azul1:#00296b;--azul2:#003f88;--azul3:#00509d;--dorado1:#fdc500;--dorado2:#ffd500}
body{margin:0;background:var(--azul1);color:#fff;font-family:'Segoe UI',Arial;padding:15px}
.login{max-width:360px;margin:60px auto;background:linear-gradient(145deg,var(--azul2),var(--azul3));padding:35px;border-radius:20px;text-align:center;border:2px solid var(--dorado2);box-shadow:0 10px 30px rgba(0,0,0,.6)}
.logo{width:100px;height:100px;border-radius:50%;border:3px solid var(--dorado2);object-fit:cover;background:#fff;box-shadow:0 0 20px rgba(255,213,0,.4)}
input,select{width:100%;padding:13px;margin:8px 0;border-radius:12px;border:1px solid var(--azul3);background:var(--azul1);color:#fff;box-sizing:border-box;font-size:15px}
input::placeholder{color:#7aa3c9}
.btn{background:linear-gradient(90deg,var(--dorado1),var(--dorado2));color:var(--azul1);padding:14px;width:100%;border:none;border-radius:12px;font-weight:900;cursor:pointer;margin-top:10px;font-size:16px;box-shadow:0 4px 15px rgba(253,197,0,.4)}
.btn-sec{background:transparent;border:1px solid var(--dorado2);color:var(--dorado2);padding:10px;border-radius:10px;cursor:pointer;width:100%;margin-top:8px}
.card{background:linear-gradient(145deg,var(--azul2),var(--azul1));padding:22px;border-radius:16px;margin-bottom:20px;border:1px solid var(--azul3);box-shadow:0 5px 20px rgba(0,0,0,.3)}
h2

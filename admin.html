<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CREDIMACH • Private Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--azul:#00296b;--azul2:#003f88;--dor:#ffd500;--dor2:#fdc500}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Space Grotesk',sans-serif}
body{background:#001233;color:#fff;min-height:100vh}
#login{position:fixed;inset:0;background:radial-gradient(circle at 30% 20%,#00509d,#001233);display:flex;align-items:center;justify-content:center;z-index:99;padding:20px}
.card-login{background:linear-gradient(135deg,rgba(0,63,136,.8),rgba(0,41,107,.9));border:1px solid var(--dor);border-radius:28px;padding:36px;width:100%;max-width:380px;text-align:center;backdrop-filter:blur(20px);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.card-login img{width:90px;height:90px;border-radius:50%;border:3px solid var(--dor);object-fit:cover;margin-bottom:16px}
input{width:100%;background:rgba(0,18,51,.8);border:1px solid rgba(255,213,0,.2);border-radius:14px;padding:14px 16px;color:#fff;margin-top:12px;outline:none;font-size:14px}
input:focus{border-color:var(--dor)}
.btn-gold{display:block;width:100%;background:linear-gradient(100deg,var(--dor2),var(--dor));color:var(--azul);padding:16px;border-radius:14px;font-weight:700;text-align:center;margin-top:18px;border:none;cursor:pointer;font-size:15px;letter-spacing:.5px}
.top{position:sticky;top:0;background:rgba(0,41,107,.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,213,0,.2);padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{width:42px;height:42px;border-radius:50%;border:2px solid var(--dor);object-fit:cover}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:18px}
.st{background:linear-gradient(135deg,rgba(0,63,136,.6),rgba(0,41,107,.8));border:1px solid rgba(255,213,0,.15);border-radius:18px;padding:14px;text-align:center}
.st b{color:var(--dor);font-size:22px;display:block}.st span{font-size:9px;color:#7fb0e0;letter-spacing:1px}
.wrap{padding:0 18px 100px}
.glass{background:linear-gradient(135deg,rgba(0,63,136,.55),rgba(0,41,107,.75));backdrop-filter:blur(20px);border:1px solid rgba(255,213,0,.2);border-radius:22px;padding:20px;margin-top:16px}
h3{font-size:12px;letter-spacing:3px;color:var(--dor);margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.client{padding:14px;border-bottom:1px solid rgba(0,80,157,.3);display:flex;justify-content:space-between;align-items:center}
.badge{padding:4px 10px;border-radius:20px;font-size:10px;font-weight:700}
.alDia{background:rgba(0,255,100,.15);color:#00ff88;border:1px solid #00ff88}
.atrasado{background:rgba(255,50,50,.15);color:#ff6b6b;border:1px solid #ff6b6b}
.finalizado{background:rgba(255,213,0,.15);color:var(--dor);border:1px solid var(--dor)}
.calc-result{background:rgba(0,18,51,.8);border-radius:14px;padding:14px;margin-top:12px;border:1px dashed var(--dor)}
.calc-result div{display:flex;justify-content:space-between;font-size:13px;margin:4px 0}
</style>
</head>
<body>
<div id="login">
<div class="card-login">
<img src="logo.png" onerror="this.src='https://i.imgur.com/8Km9tLL.png'">
<div style="letter-spacing:5px;color:var(--dor);font-weight:700">CREDIMACH</div>
<div style="font-size:9px;letter-spacing:3px;color:#5a8bc0;margin-bottom:18px">PRIVATE PANEL</div>
<input type="password" id="pass" placeholder="Clave privada">
<button class="btn-gold" onclick="entrar()">INGRESAR →</button>
<div style="font-size:10px;color:#5a8bc0;margin-top:12px">Clave por defecto: credimach2026</div>
</div>
</div>

<div id="app" style="display:none">
<div class="top">
<div style="display:flex;gap:10px;align-items:center"><img src="logo.png" class="logo" onerror="this.src='https://i.imgur.com/8Km9tLL.png'"><div><div style="color:var(--dor);font-weight:700;letter-spacing:3px;font-size:12px">CREDIMACH</div><div style="font-size:9px;color:#7fb0e0;letter-spacing:2px">PANEL PRIVADO</div></div></div>
<button onclick="localStorage.clear();location.reload()" style="background:none;border:1px solid var(--dor);color:var(--dor);padding:6px 12px;border-radius:20px;font-size:10px">SALIR</button>
</div>

<div class="stats">
<div class="st"><b id="sTotal">$0</b><span>PRESTADO</span></div>
<div class="st"><b id="sClientes">0</b><span>CLIENTES</span></div>
<div class="st"><b id="sAtras">0</b><span>ATRASADOS</span></div>
</div>

<div class="wrap">
<div class="glass">
<h3>CALCULADORA 40% FIJA</h3>
<div class="row2"><input id="monto" type="number" placeholder="Monto Ej: 100000"><input id="cuotas" type="number" placeholder="Cuotas Ej: 4"></div>
<button class="btn-gold" onclick="calcular()" style="margin-top:12px">CALCULAR TOTAL</button>
<div class="calc-result" id="resCalc" style="display:none">
<div><span>Monto:</span><b id="rMonto">$0</b></div>
<div><span>Interés 40%:</span><b id="rInteres" style="color:var(--dor)">$0</b></div>
<div><span>Total a cobrar:</span><b id="rTotal">$0</b></div>
<div><span>Valor cuota:</span><b id="rCuota" style="color:var(--dor)">$0</b></div>
</div>
</div>

<div class="glass">
<h3>NUEVO CLIENTE</h3>
<input id="nombre" placeholder="Nombre y apellido">
<div class="row2"><input id="dni" placeholder="DNI"><input id="tel" placeholder="Tel / WhatsApp"></div>
<input id="dir" placeholder="Dirección">
<div class="row2"><input id="cMonto" type="number" placeholder="Monto prestado"><input id="cCuotas" type="number" placeholder="Cuotas"></div>
<select id="estado" style="width:100%;background:rgba(0,18,51,.8);border:1px solid rgba(255,213,0,.2);border-radius:14px;padding:14px;color:#fff;margin-top:12px">

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CREDIMACH</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{background:#001233;color:#fff}
#login{position:fixed;inset:0;z-index:9999;background:radial-gradient(ellipse at center,#002060 0%,#001233 70%);display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:380px;background:rgba(10,31,77,.9);border:1px solid rgba(255,213,0,.5);border-radius:28px;padding:36px 28px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.1)}
.brand-title{
  font-family:'Cinzel',serif;
  font-weight:800;
  font-size:29px;
  letter-spacing:8px;
  margin-top:18px;
  background:linear-gradient(180deg,#ffe87a 0%,#ffd500 40%,#b89400 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  text-shadow:0 2px 10px rgba(255,213,0,.3);
  filter:drop-shadow(0 1px 0 rgba(255,255,255,.3));
}
.brand-sub{font-family:'Outfit',sans-serif;font-weight:400;font-size:10px;letter-spacing:6px;color:rgba(255,255,255,.4);margin-top:6px}
.inp{width:100%;background:#001a4d;border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:16px;color:#fff;margin-top:14px;font-size:16px;outline:none;transition:.2s}
.inp:focus{border-color:#ffd500;box-shadow:0 0 0 3px rgba(255,213,0,.15)}
.btn{width:100%;background:linear-gradient(180deg,#ffe066,#ffd500);color:#001233;padding:16px;border-radius:16px;font-weight:800;border:none;margin-top:16px;font-size:15px;letter-spacing:1px;cursor:pointer;box-shadow:0 8px 20px rgba(255,213,0,.25)}
#app{display:none}
.top{position:sticky;top:0;z-index:10;background:#00296b;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,213,0,.3)}
.top .brand-mini{font-family:'Cinzel',serif;font-weight:800;letter-spacing:4px;font-size:16px;background:linear-gradient(180deg,#ffe87a,#ffd500);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:14px}
.st{background:#003f88;border:1px solid rgba(255,213,0,.3);border-radius:18px;padding:14px;text-align:center}
.st b{color:#ffd500;font-size:22px;display:block}
.wrap{padding:0 14px 120px}
.box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:20px;margin-top:14px}
.box h3{font-family:'Cinzel',serif;color:#ffd500;font-size:11px;letter-spacing:4px;margin-bottom:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lab{font-size:10px;color:#8fb8de;letter-spacing:2px;margin:10px 0 2px 4px;display:block}
.client{padding:18px 0;border-bottom:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;gap:12px}
.badge{padding:6px 14px;border-radius:20px;font-size:11px;font-weight:800;border:1px solid}
.ok{color:#00ff88;border-color:#00ff88;background:rgba(0,255,136,.12)}
.mal{color:#ff8a8a;border-color:#ff8a8a;background:rgba(255,80,80,.12)}
.fin{color:#ffd500;border-color:#ffd500;background:rgba(255,213,0,.15)}
.dias{font-size:12px;font-weight:800;padding:6px 12px;border-radius:12px;display:inline-block;margin-top:8px}
.dv{background:rgba(0,255,136,.15);color:#00ff88;border:1px solid #00ff88}
.da{background:rgba(255,213,0,.15);color:#ffd500;border:1px solid #ffd500}
.dr{background:rgba(255,80,80,.15);color:#ff8a8a;border:1px solid #ff8a8a}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:rgba(0,0,0,.25);padding:12px;border-radius:14px;margin-top:10px}
.grid span{font-size:11px;color:#8fb8de}
.grid b{font-size:15px}
.wa{background:#25D366;color:#fff;padding:8px 14px;border-radius:20px;font-size:12px;font-weight:800;text-decoration:none;display:inline-block;margin-top:8px}
.btnp{background:#ffd500;color:#001233;padding:8px 16px;border-radius:20px;font-size:12px;font-weight:800;border:none;cursor:pointer;margin-top:8px}

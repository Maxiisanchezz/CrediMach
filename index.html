<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CREDIMACH</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{background:#001233;color:#fff;min-height:100vh}
#login{position:fixed;inset:0;z-index:999;background:#001233;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:400px;background:rgba(255,255,255,.08);border:1px solid rgba(255,213,0,.3);border-radius:28px;padding:32px 24px;text-align:center}
.inp{width:100%;background:#001a4d;border:1px solid rgba(255,255,255,.25);border-radius:16px;padding:16px;color:#fff;margin-top:12px;font-size:17px;outline:none}
.btn{width:100%;background:#ffd500;color:#001233;padding:16px;border-radius:16px;font-weight:800;border:none;margin-top:14px;font-size:15px;cursor:pointer}
.ghost{width:100%;background:transparent;border:1px dashed rgba(255,213,0,.4);color:#ffd500;padding:12px;border-radius:14px;margin-top:10px;font-weight:700;cursor:pointer}
#app{display:none}
.top{position:sticky;top:0;background:#00296b;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,213,0,.2)}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:14px}
.st{background:rgba(0,63,136,.8);border:1px solid rgba(255,213,0,.2);border-radius:18px;padding:14px;text-align:center}
.st b{color:#ffd500;font-size:22px;display:block}
.wrap{padding:0 14px 100px}
.box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:20px;margin-top:14px}
.box h3{color:#ffd500;font-size:13px;letter-spacing:2px;margin-bottom:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.client{padding:18px 0;border-bottom:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;gap:10px}
.badge{padding:6px 12px;border-radius:20px;font-size:11px;font-weight:800;border:1px solid}
.ok{color:#00ff88;border-color:#00ff88;background:rgba(0,255,136,.12)}
.mal{color:#ff6b6b;border-color:#ff6b6b;background:rgba(255,80,80,.12)}
.fin{color:#ffd500;border-color:#ffd500;background:rgba(255,213,0,.15)}
.dias{font-size:13px;font-weight:800;padding:6px 12px;border-radius:10px;display:inline-block;margin-top:8px}
.dv{background:rgba(0,255,136,.15);color:#00ff88}
.da{background:rgba(255,213,0,.15);color:#ffd500}
.dr{background:rgba(255,80,80,.15);color:#ff6b6b}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:rgba(0,0,0,.2);padding:12px;border-radius:14px;margin-top:10px}
.grid span{font-size:11px;color:#8fb8de;display:block}
.grid b{font-size:15px}
.wa{background:#25D366;color:#fff;padding:8px 14px;border-radius:20px;font-size:12px;font-weight:800;text-decoration:none;display:inline-block;margin-top:8px}
.btnp{background:rgba(255,213,0,.15);border:1px solid #ffd500;color:#ffd500;padding:8px 14px;border-radius:20px;font-size:12px;font-weight:800;cursor:pointer;margin-top:8px}
.prog{height:8px;background:rgba(255,255,255,.15);border-radius:8px;margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#00ff88,#ffd500)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}
.mc{width:100%;max-width:360px;background:#0d234f;border:1px solid #ffd500;border-radius:20px;padding:20px}
</style>
</head>
<body>
<div id="login"><div class="card">
<img src="./logo.png" style="width:90px;height:90px;border-radius:50%;border:3px solid #ffd500;background:#fff;object-fit:contain;padding:6px">
<div style="color:#ffd500;font-weight:800;letter-spacing:6px;font-size:24px;margin-top:12px">CREDIMACH</div>
<div style="color:#8fb8de;font-size:10px;letter-spacing:4px;margin-top:4px">PRIVATE EDITION</div>
<input type="password" id="pass" class="inp" placeholder="Clave" onkeydown="if(event.key==='Enter') entrar()">
<button class="btn" onclick="entrar()">ENTRAR</button>
<button class="ghost" onclick="forzar()">NO ENTRA? TOCA ACA</button>
</div></div>
<div id="app">
<div class="top"><div style="display:flex;gap:12px;align-items:center"><img src="./logo.png" style="width:42px;height:42px;border-radius:50%;border:2px solid #ffd500;background:#fff;object-fit:contain;padding:3px"><div><div style="color:#ffd500;font-weight:800;letter-spacing:3px">CREDIMACH</div><div style="font-size:9px;color:#8fb8de">CONTROL PRIVADO</div></div></div><button onclick="salir()" style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:8px 14px;border-radius:20px;font-size:12px">SALIR</button></div>
<div class="stats"><div class="st"><b id="sTotal">$0</b><span style="font-size:11px;color:#8fb8de">PRESTADO</span></div><div class="st"><b id="sCli">0</b><span style="font-size:11px;color:#8fb8de">CLIENTES</span></div><div class="st"><b id="sAtr">0</b><span style="font-size:11px;color:#8fb8de">VENCIDOS</span></div></div>
<div class="wrap">
<div class="box"><h3>NUEVO CLIENTE</h3>
<input id="nombre" class="inp" placeholder="Nombre completo *">
<div class="row"><input id="dni" class="inp" placeholder="DNI"><input id="tel" class="inp" placeholder="WhatsApp 385..."></div>
<div class="row"><input id="cMonto" class="inp" type="number" placeholder="Monto" oninput="calc()"><input id="cCuo2" class="inp" type="number" placeholder="Cuotas" oninput="calc()"></div>
<div id="preview" style="display:none;background:rgba(0,0,0,.3);border:1px dashed #ffd500;border-radius:14px;padding:14px;margin-top:10px;font-size:14px"></div>
<input id="fechaInicio" class="inp" type="date" oninput="calc()"><input id="fechaFin" class="inp" type="date">
<select id="est" class="inp"><option>Al dia</option><option>Atrasado</option><option>Finalizado</option></select>
<button class="btn" onclick="guardar()">GUARDAR CLIENTE</button>
<div id="msgOk" style="display:none;background:#00ff88;color:#001233;padding:12px;border-radius:12px;margin-top:10px;text-align:center;font-weight:800">GUARDADO</div>
</div>
<div class="box"><h3>CARTERA</h3><input id="bus" class="inp" style="margin:0 0 12px 0" oninput="render()" placeholder="Buscar..."><div id="lista"></div></div>
</div>
</div>
<div id="modalPago" class="modal" onclick="if(event.target==this)cerrar()"><div class="mc">
<div style="display:flex;justify-content:space-between"><h3 style="color:#ffd500">REGISTRAR PAGO</h3><span onclick="cerrar()" style="cursor:pointer;color:#fff;font-size:20px">X</span></div>
<div id="modalInfo" style="margin:14px 0;background:rgba(0,0,0,.3);padding:12px;border-radius:12px;font-size:14px"></div>
<input id="montoPago" type="number" class="inp" placeholder="Cuanto pago?">
<input id="fechaPago" type="date" class="inp">
<button class="btn" onclick="confirmar(true)">GUARDAR + WHATSAPP</button>
<button class="ghost" onclick="confirmar(false)">SOLO GUARDAR</button>
</div></div>
<script>
var CLAVE="Todocasero.2020";
function entrar(){var v=document.getElementById('pass').value.trim().toLowerCase();if(v===CLAVE.toLowerCase()||v==="todocasero2020"){localStorage.setItem('log','ok');mostrar();}else{alert('Clave: Todocasero.2020');}}
function forzar(){localStorage.setItem('log','ok');mostrar();}
function mostrar(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';render();}
function salir(){document.getElementById('app').style.display='none';document.getElementById('login').style.display='flex';document.getElementById('pass').value='';}
if(localStorage.getItem('log')=='ok'){mostrar();}
function getData(){
try{
var keys=['CREDIMACH_PAGOS_V1','CREDIMACH_FINAL_V6','CREDIMACH_FINAL_V5','CREDIMACH_OFICIAL','CREDIMACH_FINAL','CREDIMACH_V4','CREDIMACH_V3'];
var todos=[];
for(var k=0;k<keys.length;k++){try{var d=JSON.parse(localStorage.getItem(keys[k])||'[]');if(Array.isArray(d)) todos=todos.concat(d);}catch(e){}}
var actual=JSON.parse(localStorage.getItem('CREDIMACH_DB')||'[]'); todos=todos.concat(actual);
var map={}; var final=[];
for(var i=0;i<todos.length;i++){var c=todos[i]; if(!c.id) c.id=Date.now()+Math.random(); if(!map[c.id]){map[c.id]=true; if(!c.pagos) c.pagos=[]; if(!c.pagado) c.pagado=0; if(!c.interes) c.interes=(c.monto||0)*0.4; if(!c.total) c.total=(c.monto||0)*1.4; if(!c.cuotaM) c.cuotaM=c.total/(c.cuotas||1); final.push(c);}}
localStorage.setItem('CREDIMACH_DB',JSON.stringify(final));
return final;
}catch(e){return JSON.parse(localStorage.getItem('CREDIMACH_DB')||'[]');}
}
function saveAll(a){localStorage.setItem('CREDIMACH_DB',JSON.stringify(a));}
function calc(){
var m=parseFloat(document.getElementById('cMonto').value)||0;
var c=parseFloat(document.getElementById('cCuo2').value)||0;
if(m>0){
var i=m*0.4; var t=m+i; var cuota=c>0?Math.round(t/c):t;
document.getElementById('preview').style.display='block';
document.getElementById('preview').innerHTML='Interes 40%: <b style="color:#ffd500">$'+i.toLocaleString('es-AR')+'</b><br>Total: $'+t.toLocaleString('es-AR')+'<br>Cuota x'+(c||1)+': <b style="color:#ffd500;font-size:18px">$'+cuota.toLocaleString('es-AR')+'</b>';
}
var inicio=document.getElementById('fechaInicio').value;
if(inicio && c>0){
var parts=inicio.split('-'); var y=parseInt(parts[0]); var mm=parseInt(parts[1])-1; var d=parseInt(parts[2]);
var dt=new Date(y,mm,d); dt.setMonth(dt.getMonth()+c);
var yy=dt.getFullYear(); var mo=('0'+(dt.getMonth()+1)).slice(-2); var dd=('0'+dt.getDate()).slice(-2);
document.getElementById('fechaFin').value=yy+'-'+mo+'-'+dd;
}
}
function guardar(){
var n=document.getElementById('nombre').value.trim(); if(!n){alert('Nombre');return;}
var monto=parseFloat(document.getElementById('cMonto').value)||0; var cuotas=parseFloat(document.getElementById('cCuo2').value)||0;
if(monto<=0){alert('Monto');return;}
var interes=monto*0.4; var total=monto+interes; var cuotaM=cuotas>0?total/cuotas:total;
var o={id:Date.now(),nombre:n,dni:document.getElementById('dni').value,tel:document.getElementById('tel').value,monto:monto,cuotas:cuotas,interes:interes,total:total,cuotaM:cuotaM,fechaInicio:document.getElementById('fechaInicio').value,fechaFin:document.getElementById('fechaFin').value,est:document.getElementById('est').value,pagos:[],pagado:0};
var a=getData(); a.push(o); saveAll(a);
document.getElementById('msgOk').style.display='block'; setTimeout(function(){document.getElementById('msgOk').style.display='none';},2000);
document.getElementById('nombre').value=''; document.getElementById('dni').value=''; document.getElementById('tel').value=''; document.getElementById('cMonto').value=''; document.getElementById('cCuo2').value=''; document.getElementById('fechaInicio').value=''; document.getElementById('fechaFin').value=''; document.getElementById('preview').style.display='none';
render();
}function fmt(f){if(!f) return '-'; var p=f.split('-'); return p[2]+'/'+p[1]+'/'+p[0];}
function diasInfo(f){
if(!f) return {txt:'Sin fecha',cls:'da',num:9999};
var hoy=new Date(); hoy.setHours(0,0,0,0);
var parts=f.split('-'); var fin=new Date(parseInt(parts[0]),parseInt(parts[1])-1,parseInt(parts[2])); fin.setHours(0,0,0,0);
var diff=Math.ceil((fin-hoy)/86400000);
if(diff<0) return {txt:'VENCIDO hace '+Math.abs(diff)+' dias',cls:'dr',num:diff};
if(diff==0) return {txt:'VENCE HOY',cls:'dr',num:0};
if(diff<=15) return {txt:'Faltan '+diff+' dias',cls:'da',num:diff};
return {txt:'Faltan '+diff+' dias',cls:'dv',num:diff};
}
var clienteActual=null;
function abrirPago(id){var list=getData(); for(var i=0;i<list.length;i++){if(list[i].id==id) clienteActual=list[i];} var pagado=clienteActual.pagado||0; var saldo=(clienteActual.total||0)-pagado; document.getElementById('modalInfo').innerHTML='<b>'+clienteActual.nombre+'</b><br>Total: $'+(clienteActual.total||0).toLocaleString('es-AR')+' - Pagado: <b style="color:#00ff88">$'+pagado.toLocaleString('es-AR')+'</b><br>Saldo: <b style="color:#ffd500">$'+saldo.toLocaleString('es-AR')+'</b>'; document.getElementById('fechaPago').valueAsDate=new Date(); document.getElementById('montoPago').value=clienteActual.cuotaM?Math.round(clienteActual.cuotaM):''; document.getElementById('modalPago').style.display='flex';}
function cerrar(){document.getElementById('modalPago').style.display='none';}
function confirmar(conWA){
var monto=parseFloat(document.getElementById('montoPago').value)||0; if(monto<=0){alert('Monto');return;}
var fecha=document.getElementById('fechaPago').value||new Date().toISOString().slice(0,10);
var a=getData(); var idx=-1; for(var i=0;i<a.length;i++){if(a[i].id==clienteActual.id) idx=i;}
if(idx==-1) return;
if(!a[idx].pagos) a[idx].pagos=[];
a[idx].pagos.push({monto:monto,fecha:fecha,fechaTxt:fmt(fecha)});
a[idx].pagado=(a[idx].pagado||0)+monto;
if(a[idx].pagado>=a[idx].total) a[idx].est='Finalizado';
saveAll(a); cerrar(); render();
if(conWA){
var tel=(a[idx].tel||'').replace(/[^0-9]/g,''); if(tel){if(tel.indexOf('54')!==0) tel='549'+tel; var pagado=a[idx].pagado; var saldo=a[idx].total-pagado; var msg='Hola '+a[idx].nombre+'%0A✅ PAGO RECIBIDO - CREDIMACH%0A💵 Pagaste: $'+monto.toLocaleString('es-AR')+'%0A📅 '+fmt(fecha)+'%0A📊 Total: $'+a[idx].total.toLocaleString('es-AR')+'%0A✅ Pagado: $'+pagado.toLocaleString('es-AR')+'%0A💰 Saldo: $'+saldo.toLocaleString('es-AR'); window.open('https://wa.me/'+tel+'?text='+msg,'_blank');}
}
}
function render(){
var a=getData();
var total=0; for(var i=0;i<a.length;i++) total+=a[i].monto||0;
document.getElementById('sTotal').

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CREDIMACH</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#001233;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:360px;background:rgba(255,255,255,.07);border:1px solid #ffd50044;border-radius:28px;padding:30px;text-align:center}
input{width:100%;padding:15px;border-radius:14px;border:1px solid #ffffff22;background:#001a4d;color:#fff;margin-top:12px;font-size:16px}
button{width:100%;padding:15px;border-radius:14px;border:none;font-weight:800;margin-top:12px;cursor:pointer}
.btn1{background:#ffd500;color:#001233}
.btn2{background:transparent;border:1px solid #ffd500;color:#ffd500;font-size:11px}
#app{display:none;position:fixed;inset:0;background:#001233;overflow:auto}
.top{padding:14px;background:#00296b;display:flex;justify-content:space-between}
.box{background:rgba(255,255,255,.05);border:1px solid #ffffff11;border-radius:20px;padding:16px;margin:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.c{padding:10px 0;border-bottom:1px solid #ffffff11;display:flex;justify-content:space-between}
</style>
</head>
<body>

<div id="login" class="card">
<img src="https://i.imgur.com/8Km9tLL.png" style="width:70px;height:70px;border-radius:50%;border:2px solid #ffd500;background:#fff">
<div style="color:#ffd500;font-weight:800;letter-spacing:4px;margin-top:10px">CREDIMACH</div>
<div style="font-size:10px;color:#7fb0e0;letter-spacing:3px;margin-bottom:10px">PRIVATE</div>
<input type="text" id="p" placeholder="Escribí tu clave" autocomplete="off">
<button class="btn1" onclick="login()">ENTRAR</button>
<button class="btn2" onclick="forzar()">¿NO PODES ENTRAR? TOCA ACÁ</button>
<div id="error" style="color:#ff8a8a;font-size:11px;margin-top:10px;display:none"></div>
</div>

<div id="app">
<div class="top"><b style="color:#ffd500">CREDIMACH</b><button onclick="localStorage.clear();location.reload()" style="background:none;border:1px solid #ffd500;color:#ffd500;padding:5px 10px;border-radius:20px;font-size:10px">SALIR</button></div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:14px"><div style="background:#003f88;border-radius:14px;padding:10px;text-align:center"><b id="t1" style="color:#ffd500">$0</b><div style="font-size:8px">TOTAL</div></div><div style="background:#003f88;border-radius:14px;padding:10px;text-align:center"><b id="t2">0</b><div style="font-size:8px">CLIENTES</div></div><div style="background:#003f88;border-radius:14px;padding:10px;text-align:center"><b id="t3">0</b><div style="font-size:8px">ATRASADOS</div></div></div>
<div style="padding:0 14px 90px">
<div class="box"><div class="row"><input id="monto" type="number" placeholder="Monto"><input id="cuotas" type="number" placeholder="Cuotas"></div><button class="btn1" onclick="calc()">CALCULAR 40%</button><div id="cr" style="display:none;margin-top:10px;font-size:13px"></div></div>
<div class="box"><input id="nombre" placeholder="Nombre *"><div class="row"><input id="dni" placeholder="DNI"><input id="tel" placeholder="Tel"></div><div class="row"><input id="cMonto" type="number" placeholder="Monto dado"><input id="cCuo" type="number" placeholder="Cuotas"></div><select id="est" style="width:100%;padding:12px;border-radius:10px;background:#001a4d;color:#fff;margin-top:10px"><option>Al día</option><option>Atrasado</option><option>Finalizado</option></select><textarea id="nota" placeholder="Notas" style="width:100%;padding:12px;border-radius:10px;background:#001a4d;color:#fff;margin-top:10px;min-height:50px"></textarea><button class="btn1" onclick="save()">GUARDAR CLIENTE</button><div id="ok" style="display:none;background:#00ff88;color:#001233;padding:8px;border-radius:8px;margin-top:8px;text-align:center;font-weight:800;font-size:12px">✓ GUARDADO</div></div>
<div class="box"><input id="bus" oninput="ver()" placeholder="Buscar..."><div id="lista"></div></div>
</div>
</div>

<script>
const CLAVE_CORRECTA="Todocasero.2020";
function login(){
let v=document.getElementById('p').value.trim();
let v2=v.toLowerCase();
if(v===CLAVE_CORRECTA || v2==="todocasero.2020" || v2==="todocasero2020"){
  localStorage.setItem('log','ok');
  mostrarApp();
}else{
  document.getElementById('error').style.display='block';
  document.getElementById('error').innerText="Clave mal escrita. Probá: Todocasero.2020 (con T mayúscula y punto)";
}
}
function forzar(){
  // botón de emergencia para vos
  localStorage.setItem('log','ok');
  mostrarApp();
}
function mostrarApp(){
document.getElementById('login').style.display='none';
document.getElementById('app').style.display='block';
ver();
}
if(localStorage.getItem('log')=='ok'){mostrarApp()}

function calc(){let m=+document.getElementById('monto').value||0,c=+document.getElementById('cuotas').value||1;if(!m)return;let i=m*0.4,t=m+i;document.getElementById('cr').style.display='block';document.getElementById('cr').innerHTML=`Interés: $${i} <br> Total: $${t} <br> Cuota: $${(t/c).toFixed(0)}`;}
function get(){try{return JSON.parse(localStorage.getItem('CLIENTES')||'[]')}catch(e){return []}}
function save(){
let n=document.getElementById('nombre').value.trim();if(!n){alert('Nombre');return}
let o={id:Date.now(),nombre:n,dni:document.getElementById('dni').value,monto:+document.getElementById('cMonto').value||0,cuotas:+document.getElementById('cCuo').value||0,est:document.getElementById('est').value,nota:document.getElementById('nota').value,fecha:new Date().toLocaleDateString()};
let a=get();a.push(o);localStorage.setItem('CLIENTES',JSON.stringify(a));
document.getElementById('ok').style.display='block';setTimeout(()=>document.getElementById('ok').style.display='none',2000);
['nombre','dni','tel','cMonto','cCuo','nota'].forEach(id=>{let e=document.getElementById(id);if(e)e.value=''});ver();
}
function ver(){
let a=get();let b=(document.getElementById('bus').value||'').toLowerCase();
let f=a.filter(x=>x.nombre.toLowerCase().includes(b));
let h='';f.forEach(x=>{h+=`<div class=c><div><b>${x.nombre}</b><div style="font-size:11px;color:#8fb8de">$${x.monto} • ${x.est} • ${x.fecha}</div></div><div><span style="font-size:10px;color:#ff8a8a" onclick="del(${x.id})">Borrar</span></div></div>`});
document.getElementById('lista').innerHTML=h||'Sin clientes';
document.getElementById('t1').innerText='$'+a.reduce((s,x)=>s+x.monto,0);
document.getElementById('t2').innerText=a.length;
document.getElementById('t3').innerText=a.filter(x=>x.est=='Atrasado').length;
}
function del(id){if(confirm('Borrar?')){localStorage.setItem('CLIENTES',JSON.stringify(get().filter(x=>x.id!=id)));ver()}}
document.getElementById('p').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script>
</body>
                                                                                                                                                                         </html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CREDIMACH</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#001233">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="./logo.png">
<style>
body{margin:0;background:#001233;display:flex;align-items:center;justify-content:center;min-height:100vh}
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#001233;z-index:999}
.card{width:90%;max-width:350px;background:#fff;border-radius:20px;padding:24px;text-align:center}
.card .logo{width:90px;height:90px;background:#001233;color:#ffd500;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:28px}
.card h1{color:#001233;margin:12px 0;font-size:28px}
.inp{width:100%;padding:12px;border-radius:10px;border:1px solid #ccc;margin-top:10px}
.btn{width:100%;padding:12px;border-radius:10px;border:none;background:#001233;color:#ffd500;font-weight:900;margin-top:10px;font-size:16px}
#app{display:none;color:#fff;padding:12px}
</style>
</head>
<body>
<div id="login">
  <div class="card">
    <div class="logo">CM</div>
    <h1>CrediMach</h1>
    <input id="pass" class="inp" type="password" placeholder="Clave">
    <button class="btn" onclick="entrar()">ENTRAR</button>
    <div id="err" style="display:none;color:red;margin-top:8px">Clave incorrecta</div>
  </div>
</div>
<div id="app">
  <h2 style="color:#ffd500">Entraste bien</h2>
  <p>Ahora se ve. Si ves esto, ya te paso la version completa con clientes y con el fondo moviendose PERO sin tapar.</p>
  <button onclick="localStorage.removeItem('log');location.reload()" style="margin-top:20px;padding:10px">SALIR</button>
</div>
<script>
function entrar(){let v=document.getElementById('pass').value.trim();if(v==="Todocasero.2020"||v.toLowerCase()==="todocasero2020"){localStorage.setItem('log','ok');document.getElementById('login').style.display='none';document.getElementById('app').style.display='block'}else{document.getElementById('err').style.display='block'}}
if(localStorage.getItem('log')==='ok'){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block'}
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js')}
</script>
</body>
</html>

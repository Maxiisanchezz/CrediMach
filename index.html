<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>CREDIMACH • Private</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--azul:#00296b;--azul2:#003f88;--dor:#ffd500;--dor2:#fdc500;--bg:#001233}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Space Grotesk',sans-serif}
body{background:var(--bg);color:#fff;min-height:100vh}
#login{position:fixed;inset:0;z-index:99;background:radial-gradient(circle at 20% 20%,#003f88,#001233);display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:100%;max-width:360px;background:rgba(255,255,255,.06);backdrop-filter:blur(30px);border:1px solid rgba(255,213,0,.25);border-radius:28px;padding:32px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.login-card img{width:78px;height:78px;border-radius:50%;border:2px solid var(--dor);object-fit:cover;background:#fff}
input,select{width:100%;background:rgba(0,18,51,.8);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:14px;color:#fff;margin-top:10px;outline:none;font-size:14px}
input:focus{border-color:var(--dor)}
.btn{display:block;width:100%;background:linear-gradient(100deg,var(--dor2),var(--dor));color:var(--azul);padding:15px;border-radius:14px;font-weight:800;text-align:center;margin-top:14px;border:none;cursor:pointer}
.top{position:sticky;top:0;z-index:10;background:rgba(0,41,107,.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,213,0,.15);padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:16px}
.s{background:linear-gradient(135deg,rgba(0,63,136,.6),rgba(0,41,107,.8));border:1px solid rgba(255,213,0,.12);border-radius:18px;padding:12px;text-align:center}
.s b{color:var(--dor);font-size:20px;display:block}.s i{font-size:8px;color:#8fb8de;letter-spacing:1px;font-style:normal}
.wrap{padding:0 16px 90px}
.box{background:rgba(255,255,255,.05);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:18px;margin-top:14px}
.box h3{font-size:10px;letter-spacing:3px;color:var(--dor);margin-bottom:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.client{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07);display:flex;justify-content:space-between}
.badge{padding:3px 9px;border-radius:20px;font-size:9px;font-weight:700;border:1px solid}
.ok{color:#00ff88;border-color:#00ff88;background:rgba(0,255,136,.1)}
.mal{color:#ff6b6b;border-color:#ff6b6b;background:rgba(255,70,70,.1)}
.fin{color:var(--dor);border-color:var(--dor);background:rgba(255,213,0,.1)}
.calc{background:rgba(0,18,51,.7);border:1px dashed var(--dor);border-radius:14px;padding:12px;margin-top:10px}
.calc div{display:flex;justify-content:space-between;font-size:13px;margin:4px 0}
</style>
</head>
<body>
<div id="login">
<div class="login-card">
<img src="logo.png" onerror="this.src='https://i.imgur.com/8Km9tLL.png'">
<div style="margin-top:12px;color:var(--dor);letter-spacing:5px;font-weight:800;font-size:14px">CREDIMACH</div>
<div style="font-size:8px;letter-spacing:4px;color:#7fb0e0;margin-bottom:16px">PRIVATE APP</div>
<input type="password" id="pass" placeholder="Tu clave privada">
<button class="btn" onclick="entrar()">ENTRAR A MI PANEL</button>
</div>
</div>

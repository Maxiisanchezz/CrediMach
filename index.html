<style>
:root{--dor:#ffd500;--bg:#001233;--card:#0e2a6b}

body{background:var(--bg);color:#fff;min-height:100vh}
#login{position:fixed;inset:0;z-index:99;background:radial-gradient(130% 130% at 10% 10%,#003f88 0%,#00296b 35%,#001233 75%);display:flex;align-items:center;justify-content:center;padding:20px}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.client{padding:20px 0;border-bottom:1px solid rgba(255,255,255,.07);display:flex;justify-content:space-between;gap:12px}
.badge{padding:5px 11px;border-radius:22px;font-size:9px;font-weight:800;border:1px solid;height:fit-content}
.ok{color:#00ff88;border-color:#00ff88;background:rgba(0,255,136,.12)}.mal{color:#ff6b6b;border-color:#ff6b6b;background:rgba(255,80,80,.12)}.fin{color:var(--dor);border-color:var(--dor);background:rgba(255,213,0,.14)}
.label{font-size:8px;letter-spacing:3px;color:#8fb8de;margin-top:14px;margin-bottom:4px;display:block;font-weight:700}
.dias{font-size:11px;font-weight:800;padding:6px 10px;border-radius:10px;display:inline-block;margin-top:8px}
.d-verde{background:rgba(0,255,136,.14);color:#00ff88;border:1px solid rgba(0,255,136,.4)}
.d-ama{background:rgba(255,213,0,.14);color:#ffd500;border:1px solid rgba(255,213,0,.45)}
.d-rojo{background:rgba(255,107,107,.15);color:#ff6b6b;border:1px solid rgba(255,107,107,.5)}
.grid{background:rgba(0,18,51,.6);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:10px;margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid span{color:#8fb8de;font-size:9px;display:block}.grid b{font-size:12px}
.wa{background:#25D366;color:#fff;padding:8px 14px;border-radius:20px;font-size:11px;font-weight:800;text-decoration:none;display:inline-flex;margin-top:8px}
.btn-pago{background:rgba(255,213,0,.15);border:1px solid #ffd500;color:#ffd500;padding:8px 14px;border-radius:20px;font-size:11px;font-weight:800;cursor:pointer;margin-top:8px}
.prog{height:8px;background:rgba(255,255,255,.1);border-radius:10px;margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#00ff88,#ffd500)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:20px}
.modal-card{width:100%;max-width:360px;background:#0d234f;border:1px solid rgba(255,213,0,.3);border-radius:24px;padding:22px}
</style>

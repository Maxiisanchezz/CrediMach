<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CREDIMACH</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#001233">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="./logo.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#001233;min-height:100vh}
/* FONDO QUE SE MUEVE PERO ATRAS DEL TODO */
.fondo{position:fixed;inset:0;z-index:0;background:linear-gradient(120deg,#001233,#002a6b,#001233);background-size:250% 250%;animation:mueve 12s ease infinite}
@keyframes mueve{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

#login{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;background:transparent}
.card-login{width:100%;max-width:360px;background:#ffffff;border-radius:22px;padding:26px;text-align:center;box-shadow:0 15px 50px rgba(0,0,0,.7);border:2px solid #ffd500}
.logo{width:100px;height:100px;background:#001233;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;color:#ffd500;font-weight:900;font-size:32px;font-family:'Montserrat',sans-serif}
.brand{font-family:'Montserrat',sans-serif;font-weight:900;font-size:30px;color:#001233;margin:14px 0 18px}
.inp{width:100%;padding:13px;border-radius:10px;border:1px solid #ccc;background:#fff;color:#001233;margin-top:8px;font-size:15px}
.inp-dark{background:#001a4d;color:#fff;border:1px solid rgba(255,255,255,.2)}
.btn{width:100%;padding:13px;border-radius:10px;border:none;background:#001233;color:#ffd500;font-weight:900;margin-top:10px;font-size:16px;cursor:pointer}
.btn-yellow{background:#ffd500;color:#001233}

#app{display:none;position:relative;z-index:5;padding:12px 12px 90px}
.top{background:#fff;border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center;

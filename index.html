<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CREDIMACH</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{background:#001233;color:#fff}
#login{position:fixed;inset:0;z-index:9999;background:#001233;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:360px;background:#0a1f4d;border:1px solid #ffd500;border-radius:24px;padding:32px 24px;text-align:center}
.brand-title{font-family:'Cinzel',serif;font-weight:800;font-size:28px;letter-spacing:6px;color:#ffd500;margin-top:16px;text-shadow:0 2px 0 #b89400,0 4px 15px rgba(255,213,0,.3)}
.inp{width:100%;background:#001a4d;border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:15px;color:#fff;margin-top:12px;font-size:15px;outline:none}
.btn{width:100%;background:#ffd500;color:#001233;padding:15px;border-radius:14px;font-weight:800;border:none;margin-top:14px;font-size:15px;cursor:pointer}
#app{display:none}
.top{position:sticky;top:0;z-index:10;background:#00296b;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px}
.st{background:#003f88;border-radius:14px;padding:12px;text-align:center}
.st b{color:#ffd500;font-size:18px;display:block}
.wrap{padding:0 12px 100px}
.box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:16px;margin-top:12px}
.box h3{color:#ffd500;font-size:10px;letter-spacing:3px;margin-bottom:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lab{font-size:9px;color:#8fb8de;letter-spacing:2px;margin:8px 0 2px 4px;display:block}
.client{padding:14px 0;border-bottom:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;gap:10px}
.badge{padding:4px 10px;border-radius:12px;font-size:10px;font-weight:800;border:1px solid}
.ok{color:#00ff88;border-color:#00ff88;background:rgba(0,255,136,.12)}
.mal{color:#ff8a8a;border-color:#ff8a8a;background:rgba(255,80,80,.12)}
.fin{color:#ffd500;border-color:#ffd500;background:rgba(255,213,0,.15)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:rgba(0,0,0,.25);padding:10px;border-radius:10px;margin-top:8px}
.grid span{font-size:10px;color:#8fb8de}
.grid b{font-size:13px}
.wa{background:#25D366;color:#fff;padding:6px 12px;border-radius:14px;font-size:11px;font-weight:800;text-decoration:none;display:inline-block;margin-top:6px}
.btnp{background:#ffd500;color:#001233;padding:6px 12px;border-radius:14px;font-size:11px;font-weight:800;border:none;cursor:pointer;margin-top:6px}
.prog{height:5px;background:rgba(255,255,255,.1);border-radius:10px;margin-top:6px;overflow:hidden}
.prog i{display:block;height:100%;background:#ffd500}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:16px;z-index:9999}
.mc{width:100%;max-width:340px;background:#0d234f;border:1px solid #ffd500;border-radius:18px;padding:18px}
</style>
</head>
<body>
<div id="login"><div class="card">
<img src="./logo.png" style="width:90px;height:90px;border-radius:50%;border:3px solid #ffd500;background:#fff;padding:6px;object-fit:contain">
<div class="brand-title">CREDIMACH</div>
<input type="password" id="pass" class="inp" placeholder="Ingrese su clave" style="margin-top:20px">
<button class="btn" onclick="entrar()">ENTRAR</button>
<div id="error" style="display:none;color:#ff8a8a;margin-top:10px;font-size:13px"></div>
</div></div>
<div id="app">
<div class="top"><div style="display:flex;gap:10px;align-items:center"><img src="./logo.png" style="width:38px;height:38px;border-radius:50%;border:2px solid #ffd500;background:#fff;padding:3px"><div style="font-family:'Cinzel',serif;font-weight:800;letter-spacing:3px;color:#ffd500;font-size:14px">CREDIMACH</div></div><button onclick="salir()" style="background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 12px;border-radius:16px">SALIR</button></div>
<div class="stats"><div class="st"><b id="sTotal">$0</b><span style="font-size:10px;color:#8fb8de">PRESTADO</span></div><div class="st"><b id="sCli">0</b><span style="font-size:10px;color:#8fb8de">CLIENTES</span></div><div class="st"><b id="sAtr">0</b><span style="font-size:10px;color:#8fb8de">VENCIDOS</span></div></div>
<div class="wrap">
<div class="box"><h3>NUEVO CLIENTE</h3>
<input id="nombre" class="inp" placeholder="Nombre completo *">
<div class="row"><input id="dni" class="inp" placeholder="DNI"><input id="tel" class="inp" placeholder="WhatsApp"></div>
<div class="row"><input id="cMonto" class="inp" type="number" placeholder="Monto" oninput="calc()"><input id="cCuo2" class="inp" type="number" placeholder="Cuotas" oninput="calc()"></div>
<div id="preview" style="display:none;background:rgba(255,213,0,.08);border:1px dashed rgba(255,213,0,.3);border-radius:10px;padding:10px;margin-top:8px;font-size:13px"></div>
<span class="lab">FECHA</span>
<div class="row">
<input id="fechaInicio" class="inp" style="margin-top:2px" type="text" placeholder="INICIO" onfocus="this.type='date'" onblur="if(!this.value)this.type='text'" oninput="calc()">
<input id="fechaFin" class="inp" style="margin-top:2px" type="text" placeholder="VENCE" onfocus="this.type='date'" onblur="if(!this.value)this.type='text'">
</div>
<select id="est" class="inp" style="margin-top:6px"><option>Al dia</option><option>Atrasado</option><option>Finalizado</option></select>
<button class="btn" onclick="guardar()">GUARDAR CLIENTE</button>
<div id="msgOk" style="display:none;background:#00ff88;color:#001233;padding:10px;border-radius:10px;margin-top:10px;text-align:center;font-weight:800;font-size:13px">✅ GUARDADO</div>
</div>
<div class="box"><h3>CARTERA</h3><input id="bus" class="inp" style="margin:0 0 10px 0" oninput="render()" placeholder="Buscar..."><div id="lista"></div></div>
</div>
</div>
<div id="modalPago" class="modal" onclick="if(event.target==this)cerrar()"><div class="mc">
<div style="display:flex;justify-content:space-between"><h3 style="color:#ffd500">PAGO</h3><span onclick="cerrar()" style="cursor:pointer;color:#fff;font-size:20px">✕</span></div>
<div id="modalInfo" style="margin:12px 0;background:rgba(0,0,0,.3);padding:10px;border-radius:10px;font-size:13px"></div>
<input id="montoPago" type="number" class="inp" placeholder="Monto">
<input id="fechaPago" type="date" class="inp">
<button class="btn" onclick="confirmar(true)">GUARDAR + WA</button>
<button class="btn" style="background:transparent;border:1px solid #ffd500;color:#ffd500" onclick="confirmar(false)">SOLO GUARDAR</button>
</div></div>
<script>
var CLAVE="Todocasero.2020";
function entrar(){var v=document.getElementById('pass').value.trim();if(v===CLAVE||v.toLowerCase().replace(/\./g,"")==="todocasero2020"){try{localStorage.setItem('credimach_log','ok');}catch(e){}document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';render();}else{document.getElementById('error').style.display='block';document.getElementById('error').innerText='Clave incorrecta';}}
function salir(){try{localStorage.removeItem('credimach_log');}catch(e){}document.getElementById('app').style.display='none';document.getElementById('login').style.display='flex';}
try{if(localStorage.getItem('credimach_log')==='ok') {document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';}}catch(e){}
function getData(){try{var data=JSON.parse(localStorage.getItem('CREDIMACH_DB')||'[]');return Array.isArray(data)?data:[];}catch(e){return [];}}
function saveAll(a){localStorage.setItem('CREDIMACH_DB',JSON.stringify(a));}
function calc(){var m=parseFloat(document.getElementById('cMonto').value)||0;var cu=parseFloat(document.getElementById('cCuo2').value)||0;if(m>0){var t=m*1.4;var q=cu>0?Math.round(t/cu):t;var p=document.getElementById('preview');p.style.display='block';p.innerHTML='Total $'+t.toLocaleString('es-AR')+' | Cuota <b style="color:#ffd500">$'+q.toLocaleString('es-AR')+'</b>';}var ini=document.getElementById('fechaInicio').value;if(ini&&cu>0){var sp=ini.split('-');if(sp.length===3){var dt=new Date(parseInt(sp[0]),parseInt(sp[1])-1,parseInt(sp[2]));dt.setMonth(dt.getMonth()+cu);var v=dt.getFullYear()+'-'+('0'+(dt.getMonth()+1)).slice(-2)+'-'+('0'+dt.getDate()).slice(-2);var el=document.getElementById('fechaFin');el.value=v;if(el.type==='text')el.type='date';}}}
function guardar(){var n=document.getElementById('nombre').value.trim();if(!n){alert('Nombre');return;}var mo=parseFloat(document.getElementById('cMonto').value)||0;if(mo<=0){alert('Monto');return;}var cu=parseFloat(document.getElementById('cCuo2').value)||0;var tot=mo*1.4;var cuM=cu>0?tot/cu:tot;var o={id:Date.now(),nombre:n,dni:document.getElementById('dni').value,tel:document.getElementById('tel').value,monto:mo,cuotas:cu,total:tot,cuotaM:cuM,fechaInicio:document.getElementById('fechaInicio').value,fechaFin:document.getElementById('fechaFin').value,est:document.getElementById('est').value,pagos:[],pagado:0};var a=getData();a.push(o);saveAll(a);document.getElementById('msgOk').style.display='block';setTimeout(function(){document.getElementById('msgOk').style.display='none';},1500);document.getElementById('nombre').value='';document.getElementById('dni').value='';document.getElementById('tel').value='';document.getElementById('cMonto').value='';document.getElementById('cCuo2').value='';document.getElementById('fechaInicio').value='';document.getElementById('fechaFin').value='';document.getElementById('fechaInicio').type='text';document.getElementById('fechaFin').type='text';document.getElementById('preview').style.display='none';render();}
function fmt(f){if(!f)return'-';var p=f.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function diasInfo(f){if(!f)return{txt:'Sin fecha',cls:'da',num:9999};var h=new Date();h.setHours(0,0,0,0);var p=f.split('-');var fin=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));fin.setHours(0,0,0,0);var diff=Math.ceil((fin-h)/86400000);if(diff<0)return{txt:'VENCIDO '+Math.abs(diff)+'d',cls:'dr',num:diff};if(diff==0)return{txt:'VENCE HOY',cls:'dr',num:0};return{txt:diff+' dias',cls:diff<=15?'da':'dv',num:diff};}
var clienteActual=null;
function abrirPago(id){var list=getData();for(var i=0;i<list.length;i++)if(list[i].id==id)clienteActual=list[i];var pag=clienteActual.pagado||0;var sal=clienteActual.total-pag;document.getElementById('modalInfo').innerHTML='<b>'+clienteActual.nombre+'</b><br>Total $'+clienteActual.total.toLocaleString('es-AR')+'<br>Pagado $'+pag.toLocaleString('es-AR')+'<br>Saldo <b style="color:#ffd500">$'+sal.toLocaleString('es-AR')+'</b>';document.getElementById('fechaPago').valueAsDate=new Date();document.getElementById('montoPago').value=clienteActual.cuotaM?Math.round(clienteActual.cuotaM):'';document.getElementById('modalPago').style.display='flex';}
function cerrar(){document.getElementById('modalPago').style.display='none';}
function confirmar(conWA){var mo=parseFloat(document.getElementById('montoPago').value)||0;if(mo<=0){alert('Monto');return;}var fe=document.getElementById('fechaPago').value||new Date().toISOString().slice(0,10);var a=getData();var idx=-1;for(var i=0;i<a.length;i++)if(a[i].id==clienteActual.id)idx=i;if(idx==-1)return;if(!a[idx].pagos)a[idx].pagos=[];a[idx].pagos.push({monto:mo,fecha:fe});a[idx].pagado=(a[idx].pagado||0)+mo;if(a[idx].pagado>=a[idx].total)a[idx].est='Finalizado';saveAll(a);cerrar();render();if(conWA){var tel=(a[idx].tel||'').replace(/[^0-9]/g,'');if(tel){if(tel.indexOf('54')!=0)tel='549'+tel;window.open('https://wa.me/'+tel+'?text=Hola '+encodeURIComponent(a[idx].nombre)+' pago $'+mo,'_blank');}}}
function render(){var a=getData();var tot=0;for(var i=0;i<a.length;i++)tot+=a[i].monto||0;document.getElementById('sTotal').innerText='$'+tot.toLocaleString('es-AR');document.getElementById('sCli').innerText=a.length;var atr=0;for(var i=0;i<a.length;i++){var d=diasInfo(a[i].fechaFin);if(d.num<0&&(a[i].pagado||0)<(a[i].total||0))atr++;}document.getElementById('sAtr').innerText=atr;var b=(document.getElementById('bus').value||'').toLowerCase();var h='';for(var i=0;i<a.length;i++){var x=a[i];if(b&&x.nombre.toLowerCase().indexOf(b)<0&& (x.dni||'').indexOf(b)<0)continue;var d=diasInfo(x.fechaFin);var pag=x.pagado||0;var sal=x.total-pag;var porc=x.total>0?Math.min(100,Math.round(pag/x.total*100)):0;var badge=x.est=='Al dia'?'ok':x.est=='Atrasado'?'mal':'fin';h+='<div class=client><div style="flex:1"><b>'+x.nombre+'</b><div style="font-size:12px;color:#8fb8de">'+(x.dni||'')+' '+(x.tel||'')+'</div><div class=grid><div><span>DADO</span><b>$'+x.monto.toLocaleString('es-AR')+'</b></div><div><span>SALDO</span><b style="color:#ffd500">$'+sal.toLocaleString('es-AR')+'</b></div></div><div class=prog><i style="width:'+porc+'%"></i></div><span class="dias '+d.cls+'">'+d.txt+'</span><br><button class=btnp onclick="abrirPago('+x.id+')">PAGO</button></div><div style="text-align:right"><div class="badge '+badge+'">'+x.est+'</div><div style="font-size:11px;color:#ff8a8a;margin-top:10px;cursor:pointer" onclick="borrar('+x.id+')">BORRAR</div></div></div>';}document.getElementById('lista').innerHTML=h;}
function borrar(id){if(confirm('Borrar?')){var a=getData().filter(function(x){return x.id!=id});saveAll(a);render();}}
</script>
</body>
</html>

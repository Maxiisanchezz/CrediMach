<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CREDIMACH • Private</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--dor:#ffd500;--bg:#001233}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Space Grotesk',sans-serif}
body{background:var(--bg);color:#fff}
#login{position:fixed;inset:0;z-index:99;background:radial-gradient(120% 120% at 15% 15%,#003f88 0%,#00296b 40%,#001233 100%);display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:100%;max-width:380px;background:rgba(255,255,255,.06);backdrop-filter:blur(40px);border:1px solid rgba(255,213,0,.25);border-radius:32px;padding:36px 28px;text-align:center}
.input-premium{width:100%;background:rgba(0,18,51,.85);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:14px 16px;color:#fff;margin-top:10px;outline:none;font-size:14px}
.btn-premium{width:100%;background:linear-gradient(100deg,#fdc500,#ffd500);color:#001233;padding:15px;border-radius:16px;font-weight:800;letter-spacing:2px;border:none;margin-top:14px;cursor:pointer}
.btn-ghost{width:100%;background:transparent;border:1px dashed rgba(255,213,0,.4);color:#ffd500;padding:11px;border-radius:14px;font-size:10px;letter-spacing:2px;margin-top:12px;cursor:pointer}
#app{display:none}.top{position:sticky;top:0;z-index:10;background:rgba(0,41,107,.88);backdrop-filter:blur(20px);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,213,0,.15)}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:16px}
.s{background:linear-gradient(180deg,rgba(0,63,136,.7),rgba(0,41,107,.6));border:1px solid rgba(255,213,0,.14);border-radius:20px;padding:14px;text-align:center}
.s b{color:var(--dor);font-size:20px;display:block}.s i{font-size:8px;color:#8fb8de;font-style:normal;letter-spacing:2px}
.wrap{padding:0 16px 90px}.box{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:20px;margin-top:16px}
.box h3{font-size:10px;letter-spacing:4px;color:var(--dor);margin-bottom:14px;font-weight:800}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.client{padding:14px 0;border-bottom:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;gap:10px}
.badge{padding:4px 10px;border-radius:20px;font-size:9px;font-weight:800;border:1px solid;white-space:nowrap}
.ok{color:#00ff88;border-color:#00ff88;background:rgba(0,255,136,.1)}.mal{color:#ff6b6b;border-color:#ff6b6b;background:rgba(255,80,80,.1)}.fin{color:var(--dor);border-color:var(--dor);background:rgba(255,213,0,.12)}
.label{font-size:9px;letter-spacing:2px;color:#8fb8de;margin-top:14px;display:block;margin-bottom:2px}
.dias{font-size:11px;font-weight:800;padding:4px 8px;border-radius:8px;display:inline-block;margin-top:6px}
.dias-verde{background:#00ff8833;color:#00ff88;border:1px solid #00ff88}
.dias-amarillo{background:#ffd50033;color:#ffd500;border:1px solid #ffd500}
.dias-rojo{background:#ff6b6b33;color:#ff6b6b;border:1px solid #ff6b6b}
</style>
</head>
<body>
<div id="login">
<div class="login-card">
<img src="https://i.imgur.com/8Km9tLL.png" style="width:84px;height:84px;border-radius:50%;border:3px solid var(--dor);background:#fff">
<div style="margin-top:14px;color:var(--dor);font-weight:800;letter-spacing:6px;font-size:18px">CREDIMACH</div>
<div style="font-size:8px;letter-spacing:5px;color:#7fb0e0;margin-bottom:16px">PRIVATE EDITION</div>
<input type="text" id="pass" class="input-premium" placeholder="Tu clave" onkeydown="if(event.key==='Enter') entrar()">
<button class="btn-premium" onclick="entrar()">ENTRAR</button>
<button class="btn-ghost" onclick="forzar()">¿NO ENTRA? TOCÁ ACÁ</button>
</div>
</div>

<div id="app">
<div class="top"><div style="color:var(--dor);font-weight:800;letter-spacing:4px;font-size:12px">CREDIMACH</div><button onclick="localStorage.clear();location.reload()" style="background:none;border:1px solid rgba(255,213,0,.3);color:var(--dor);padding:7px 14px;border-radius:20px;font-size:10px">SALIR</button></div>
<div class="stats"><div class="s"><b id="sTotal">$0</b><i>TOTAL</i></div><div class="s"><b id="sCli">0</b><i>CLIENTES</i></div><div class="s"><b id="sAtr">0</b><i>ATRASADOS</i></div></div>
<div class="wrap">
<div class="box"><h3>CALCULADORA 40%</h3><div class="row2"><input id="monto" class="input-premium" style="margin:0" type="number" placeholder="Monto"><input id="cuotas" class="input-premium" style="margin:0" type="number" placeholder="Cuotas"></div><button class="btn-premium" onclick="calc()">CALCULAR</button><div id="cRes" style="display:none;margin-top:14px;background:rgba(0,18,51,.7);border:1px dashed var(--dor);border-radius:16px;padding:14px;font-size:13px"></div></div>

<div class="box"><h3>AGREGAR CLIENTE</h3>
<input id="nombre" class="input-premium" placeholder="Nombre completo *">
<div class="row2"><input id="dni" class="input-premium" placeholder="DNI"><input id="tel" class="input-premium" placeholder="Tel"></div>
<div class="row2"><input id="cMonto" class="input-premium" type="number" placeholder="Monto dado"><input id="cCuo2" class="input-premium" type="number" placeholder="Cuotas" oninput="autoFechaFin()"></div>
<span class="label">FECHA INICIO</span><input id="fechaInicio" class="input-premium" type="date" oninput="autoFechaFin()">
<span class="label">FECHA FINALIZACIÓN (se calcula sola)</span><input id="fechaFin" class="input-premium" type="date">
<select id="est" class="input-premium"><option>Al día</option><option>Atrasado</option><option>Finalizado</option></select>
<textarea id="nota" class="input-premium" placeholder="Notas" style="min-height:60px;resize:none"></textarea>
<button class="btn-premium" onclick="guardar()">GUARDAR CLIENTE</button>
<div id="msgOk" style="display:none;background:#00ff88;color:#001233;padding:10px;border-radius:12px;margin-top:10px;text-align:center;font-weight:800;font-size:12px">✓ GUARDADO</div>
</div>

<div class="box"><h3>MIS CLIENTES</h3><input id="bus" class="input-premium" style="margin:0 0 10px 0" oninput="render()" placeholder="Buscar..."><div id="lista"></div></div>
</div>
</div>

<script>
const CLAVE="Todocasero.2020";
function entrar(){let v=document.getElementById('pass').value.trim();if(v.toLowerCase()===CLAVE.toLowerCase()||v.toLowerCase()==="todocasero2020"){localStorage.setItem('log','ok');mostrar();}else{alert('Clave: Todocasero.2020');}}
function forzar(){localStorage.setItem('log','ok');mostrar();}
function mostrar(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';render();}
if(localStorage.getItem('log')=='ok') mostrar();

function autoFechaFin(){
let inicio=document.getElementById('fechaInicio').value;
let cuotas=parseInt(document.getElementById('cCuo2').value)||0;
if(inicio && cuotas>0){
let [y,m,d]=inicio.split('-').map(Number);
let date=new Date(y,m-1,d);
date.setMonth(date.getMonth()+cuotas);
let yyyy=date.getFullYear(), mm=String(date.getMonth()+1).padStart(2,'0'), dd=String(date.getDate()).padStart(2,'0');
document.getElementById('fechaFin').value=`${yyyy}-${mm}-${dd}`;
}
}
function calc(){let m=parseFloat(document.getElementById('monto').value)||0,c=parseFloat(document.getElementById('cuotas').value)||1;if(!m)return;let i=m*0.4,t=m+i;document.getElementById('cRes').style.display='block';document.getElementById('cRes').innerHTML=`Interés: <b style="color:#ffd500">$${i.toLocaleString('es-AR')}</b><br>Total: $${t.toLocaleString('es-AR')}<br>Cuota: <b style="color:#ffd500">$${(t/c).toFixed(0)}</b>`;}

function get(){try{return JSON.parse(localStorage.getItem('CREDIMACH_V4')||localStorage.getItem('CREDIMACH_V3')||'[]')}catch(e){return []}}
function guardar(){
let n=document.getElementById('nombre').value.trim();if(!n){alert('Nombre');return;}
let o={id:Date.now(),nombre:n,dni:document.getElementById('dni').value,tel:document.getElementById('tel').value,monto:parseFloat(document.getElementById('cMonto').value)||0,cuotas:parseFloat(document.getElementById('cCuo2').value)||0,fechaInicio:document.getElementById('fechaInicio').value,fechaFin:document.getElementById('fechaFin').value,est:document.getElementById('est').value,nota:document.getElementById('nota').value};
let a=get();a.push(o);localStorage.setItem('CREDIMACH_V4',JSON.stringify(a));
document.getElementById('msgOk').style.display='block';setTimeout(()=>document.getElementById('msgOk').style.display='none',2000);
['nombre','dni','tel','cMonto','cCuo2','fechaInicio','fechaFin','nota'].forEach(id=>document.getElementById(id).value='');render();
}
function formatFecha(f){if(!f)return '-';let p=f.split('-');return `${p[2]}/${p[1]}/${p[0]}`}

function diasRestantes(fechaFin){
if(!fechaFin) return {txt:'Sin fecha',clase:'dias-amarillo',num:999};
let hoy=new Date(); hoy.setHours(0,0,0,0);
let [y,m,d]=fechaFin.split('-').map(Number);
let fin=new Date(y,m-1,d); fin.setHours(0,0,0,0);
let diff=Math.ceil((fin-hoy)/(1000*60*60*24));
if(diff<0) return {txt:`VENCIDO hace ${Math.abs(diff)} días`, clase:'dias-rojo', num:diff};
if(diff==0) return {txt:`VENCE HOY`, clase:'dias-rojo', num:0};
if(diff<=15) return {txt:`Faltan ${diff} días`, clase:'dias-amarillo', num:diff};
return {txt:`Faltan ${diff} días`, clase:'dias-verde', num:diff};
}

function render(){
let a=get();let b=(document.getElementById('bus').value||'').toLowerCase();
let f=a.filter(x=>x.nombre.toLowerCase().includes(b));
let html='';f.sort((x,y)=>{let dx=diasRestantes(x.fechaFin).num, dy=diasRestantes(y.fechaFin).num; return dx-dy;}).forEach(x=>{
let cl=x.est=='Al día'?'ok':x.est=='Atrasado'?'mal':'fin';
let dias=diasRestantes(x.fechaFin);
html+=`<div class=client><div><b style="font-size:13px">${x.nombre}</b>
<div style="font-size:11px;color:#8fb8de;margin-top:4px;line-height:1.5">
DNI:${x.dni||'-'} • $${(x.monto||0).toLocaleString('es-AR')} • ${x.cuotas} cuotas<br>
📅 ${formatFecha(x.fechaInicio)} → ${formatFecha(x.fechaFin)}<br>
<span class="dias ${dias.clase}">${dias.txt}</span><br>
<span style="color:#5a8bc0">${x.nota||''}</span>
</div></div><div style="text-align:right"><div class="badge ${cl}">${x.est}</div><div style="font-size:9px;color:#ff8a8a;margin-top:10px;cursor:pointer" onclick="borrar(${x.id})">Borrar</div></div></div>`;
});
document.getElementById('lista').innerHTML=html||'<div style="text-align:center;padding:20px;color:#5a8bc0">Sin clientes</div>';
document.getElementById('sTotal').innerText='$'+a.reduce((s,x)=>s+(x.monto||0),0).toLocaleString('es-AR');
document.getElementById('sCli').innerText=a.length;
document.getElementById('sAtr').innerText=a.filter(x=>diasRestantes(x.fechaFin).num<0).length;
}
function borrar(id){if(confirm('¿Borrar?')){localStorage.setItem('CREDIMACH_V4',JSON.stringify(get().filter(x=>x.id!=id)));render();}}
</script>
</body>
</html>

/* FONDO QUE SE MUEVE - AZUL CIELO ESPACIO */
.fondo{
  position:fixed;inset:0;z-index:0;
  background: linear-gradient(180deg, #020a1f 0%, #081a4a 50%, #0a2a6b 100%);
  overflow:hidden;
}
.estrella{
  position:absolute;background:#fff;border-radius:50%;
  animation: parpadeo 3s infinite alternate, moverEstrella 60s linear infinite;
}
@keyframes parpadeo{0%{opacity:0.2}100%{opacity:1}}
@keyframes moverEstrella{from{transform:translateY(0)}to{transform:translateY(-800px)}}
.nube{
  position:absolute;width:400px;height:400px;
  background: radial-gradient(circle, rgba(0,64,160,0.25) 0%, transparent 70%);
  border-radius:50%;animation: nubeMov 20s ease-in-out infinite alternate;
}
@keyframes nubeMov{0%{transform:translate(0,0)}100%{transform:translate(40px,-20px)}}

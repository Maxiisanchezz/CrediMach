<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CREDIMACH | Créditos en efectivo en Machagai</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#F5C242;--bg:#0F1113;--card:#1A1E23}
body{margin:0;background:var(--bg);color:#fff;font-family:'Inter',sans-serif}
.container{max-width:450px;margin:auto;padding:20px}
.header{display:flex;justify-content:space-between;align-items:center;padding:15px 0}
.logo{color:var(--gold);font-weight:800;font-size:28px;letter-spacing:1px}
.badge{border:1px solid var(--gold);color:var(--gold);padding:6px 14px;border-radius:20px;font-size:12px;display:inline-block;margin:20px 0}
h1{font-size:36px;line-height:1.1;margin:0;color:var(--gold)}
.subtitle{color:#aaa;margin:15px 0 25px;font-size:15px}
.btn-gold{background:var(--gold);color:#000;padding:18px;border-radius:14px;font-weight:800;text-align:center;display:block;text-decoration:none;font-size:18px}
.btn-outline{border:1px solid var(--gold);color:var(--gold);padding:16px;border-radius:14px;text-align:center;display:block;margin-top:12px;text-decoration:none}
.card{background:var(--card);border:1px solid #FFD70044;padding:20px;border-radius:20px;margin-top:30px}
.slider{width:100%;accent-color:var(--gold)}
.selects{display:flex;gap:10px;margin:15px 0}
.selects button{flex:1;padding:10px;border-radius:10px;border:none;background:#2a2a2a;color:#fff}
.selects .active{background:var(--gold);color:#000}
</style>
</head>
<body>
<div class="container">
<div class="header"><div class="logo">$ CREDIMACH</div><div>📍 Machagai</div></div>
<center><span class="badge">• Créditos Rápidos • 100% Online</span></center>
<h1>Créditos en efectivo en el acto</h1>
<p class="subtitle">Aprobación en minutos. Sin vueltas. Dinero en tu cuenta hoy mismo.</p>
<a href="https://wa.me/5493644TU_NUMERO" class="btn-gold">Solicitar ahora →</a>
<a href="https://wa.me/5493644TU_NUMERO" class="btn-outline">💬 Hablar por WhatsApp</a>
<div class="card">
<h3>🧮 Calculadora de préstamo</h3>
<label>Monto del crédito</label>
<input type="range" class="slider" id="monto" min="50000" max="1000000" step="10000" value="250000" oninput="calc()">
<h2 id="montoTxt" style="color:var(--gold)">$250.000</h2>
<div class="selects">
<button id="b3" onclick="setPlazo(3)">3 meses</button>
<button id="b6" class="active" onclick="setPlazo(6)">6 meses</button>
<button id="b12" onclick="setPlazo(12)">12 meses</button>
</div>
<div style="background:#0F1113;padding:15px;border-radius:12px;border:1px solid #333">
Cuota estimada <b id="cuota" style="color:var(--gold);font-size:26px;float:right">$45.230 /mes</b>
</div>
<a href="#" class="btn-gold" style="margin-top:15px;font-size:16px" onclick="calc()">Calcular y Solicitar</a>
</div>
</div>
<script>
let plazo=6;
function setPlazo(p){plazo=p;document.querySelectorAll('.selects button').forEach(b=>b.classList.remove('active'));document.getElementById('b'+p).classList.add('active');calc()}
function calc(){
let m=document.getElementById('monto').value;
document.getElementById('montoTxt').innerText='$'+parseInt(m).toLocaleString('es-AR');
let cuota=(m*1.35/plazo);
document.getElementById('cuota').innerText='$'+cuota.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ".")+' /mes';
}
calc();
</script>
</body>
</html>
